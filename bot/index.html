<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Puri menyu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js?v=3"></script>
<style>
:root{--red:#7a1010;--red2:#5c0b0b;--cream:#f7ecdc;--card:#fffaf2;--ink:#2a1a14;--muted:#7d6a5e;--line:#ead9c2;--gold:#f2c94c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:relative;background:var(--red);color:#fff;padding:18px 16px 14px;text-align:center}
.lang{position:absolute;right:12px;top:12px;display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;font-size:12px;font-weight:600;padding:5px 8px}
.lang button.on{background:var(--cream);color:var(--red)}
.logo{font:600 34px/1 Georgia,"Times New Roman",serif;letter-spacing:6px}
.sub{font-size:11px;letter-spacing:3px;opacity:.85;margin-top:6px}
nav{position:sticky;top:0;-webkit-overflow-scrolling:touch;z-index:5;background:var(--red2);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:18px;padding:7px 14px;font-size:14px}
nav button.on{background:var(--cream);color:var(--red);border-color:var(--cream);font-weight:600}
main{padding:4px 12px 110px}
h2{color:var(--red);font-size:19px;margin:20px 4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{content-visibility:auto;contain-intrinsic-size:auto 360px;background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(80,20,10,.08)}
.it img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--red);display:block}
.it .b{padding:8px 10px 10px;display:flex;flex-direction:column;flex:1}
.it .n{font-weight:600;font-size:14px;flex:1}
.it .note{font-size:12px;color:var(--muted);margin-top:2px}
.it .p{font-weight:700;margin:6px 0 8px}
.add{border:0;background:var(--red);color:#fff;border-radius:10px;padding:9px;font-size:14px;font-weight:600;width:100%}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--red);border-radius:10px;color:#fff}
.qty button{border:0;background:transparent;color:#fff;font-size:20px;width:40px;height:36px}
.qty span{font-weight:700}
#bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;display:none}
#bar button{width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;padding:15px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(90,10,10,.35)}
#cart{display:none;padding:12px 12px 120px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.top button{border:0;background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--red);font-weight:600}
.top h1{font-size:20px;margin:0;color:var(--red)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px}
.row img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.row .t{flex:1;font-size:14px}
.row .t b{display:block}
.row .qty{width:110px}
.row .qty button{width:34px;height:32px}
.sum{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin:14px 4px}
fieldset{border:0;margin:0 0 12px;padding:0}
label{display:block;font-size:13px;color:var(--muted);margin:0 4px 5px}
input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-size:16px;color:var(--ink);font-family:inherit}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 6px;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:6px 4px 0}
.err{color:#b00020;font-size:13px;margin:4px;display:none}
#done{display:none;text-align:center;padding:60px 24px}
#done .ok{font-size:54px}
#done h1{color:var(--red)}
</style>
</head>
<body>
<div id="menu">
  <header><div class="lang" id="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button></div><div class="logo">PURI</div><div class="sub">KHINKALI · KHACHAPURI</div></header>
  <nav id="cats"></nav>
  <main id="list"></main>
</div>

<div id="cart">
  <div class="top"><button onclick="show('menu')" data-t="back">← Menyu</button><h1 data-t="cart">Savat</h1></div>
  <div id="rows"></div>
  <div class="sum"><span data-t="total">Jami</span><span id="total"></span></div>

  <fieldset><label data-t="how">Qanday olasiz?</label>
    <div class="seg" id="type">
      <button data-v="delivery" class="on" data-t="delivery">Yetkazib berish</button>
      <button data-v="pickup" data-t="pickup">Olib ketaman</button>
    </div>
  </fieldset>
  <fieldset><label data-t="branch">Filial</label>
    <div class="seg" id="branch">
      <button data-v="Yunusobod" class="on" data-t="b_yun">Yunusobod Gallery</button>
      <button data-v="Chimgan" data-t="b_chim">Chimgan SM</button>
    </div>
  </fieldset>
  <fieldset><label data-t="pay">Toʻlov usuli</label>
    <div class="seg" id="pay">
      <button data-v="click" class="on">Click</button>
      <button data-v="payme">Payme</button>
      <button data-v="cash" data-t="cash">Naqd / karta</button>
    </div>
    <div class="hint" id="payHint"></div></fieldset>
  <fieldset><label for="name" data-t="name">Ismingiz</label><input id="name" autocomplete="name"></fieldset>
  <fieldset><label for="phone" data-t="phone">Telefon raqam</label><input id="phone" type="tel" inputmode="tel" placeholder="+998 __ ___ __ __" autocomplete="tel"></fieldset>
  <fieldset id="addrBox"><label for="addr" data-t="addr">Manzil</label><textarea id="addr" data-ph="addr_ph"></textarea>
    <div class="hint" data-t="addr_hint"></div></fieldset>
  <fieldset><label for="note" data-t="note">Izoh (ixtiyoriy)</label><textarea id="note" data-ph="note_ph"></textarea></fieldset>
  <div class="err" id="err"></div>
</div>

<div id="done">
  <div class="ok">✅</div>
  <h1 data-t="done">Buyurtma qabul qilindi!</h1>
  <p id="doneTxt"></p>
</div>

<div id="bar"><button id="barBtn"></button></div>

<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const API = (window.PURI_CONFIG || {}).api || "";
let MENU = {cats: [], items: []}, cart = {}, view = "menu", sending = false;
let heads = [], curId = "", ticking = false, scrollBound = false;
const $ = s => document.querySelector(s);
const T = {
  uz: {back:"← Menyu", cart:"Savat", total:"Jami", how:"Qanday olasiz?", delivery:"Yetkazib berish", pickup:"Olib ketaman",
    branch:"Filial", b_yun:"Yunusobod Gallery", b_chim:"Chimgan SM", pay:"Toʻlov usuli", cash:"Naqd / karta",
    pay_online:"Buyurtma berish tugmasini bosganingizda toʻlov oynasi ochiladi.", pay_cash:"Pulni buyurtmani qabul qilganda toʻlaysiz.",
    name:"Ismingiz", phone:"Telefon raqam", addr:"Manzil", addr_ph:"Koʻcha, uy, xonadon, moʻljal",
    addr_hint:"Yetkazish narxi va vaqtini operator qoʻngʻiroq qilib aytadi.", note:"Izoh (ixtiyoriy)", note_ph:"Masalan: achchiq boʻlmasin",
    done:"Buyurtma qabul qilindi!", done_txt:"Operatorimiz tez orada siz bilan bogʻlanadi.", add:"Qoʻshish", sum:"soʻm", pcs:"ta",
    bar_cart:"Savat", bar_order:"Buyurtma berish", sending:"Yuborilmoqda...",
    e_name:"Ismingizni yozing.", e_phone:"Telefon raqamni toʻliq yozing.", e_addr:"Yetkazish manzilini yozing.",
    e_test:"Bu sinov rejimi: buyurtma faqat Telegram ichida yuboriladi.", e_paid:n=>`Buyurtma №${n} toʻlandi. Operatorimiz tez orada siz bilan bogʻlanadi.`,
    e_ok:n=>`Buyurtma №${n}. Operatorimiz tez orada siz bilan bogʻlanadi.`, e_payfail:"Toʻlov oʻtmadi. Qayta urinib koʻring yoki boshqa usulni tanlang.",
    e_paycancel:"Toʻlov yakunlanmadi. Qayta urinib koʻring yoki boshqa usulni tanlang.", e_payoff:"Bu toʻlov usuli hali ulanmagan. Boshqa usulni tanlang.",
    e_net:"Buyurtma yuborilmadi. Internetni tekshirib, qayta urinib koʻring."},
  ru: {back:"← Меню", cart:"Корзина", total:"Итого", how:"Как получить заказ?", delivery:"Доставка", pickup:"Самовывоз",
    branch:"Филиал", b_yun:"Yunusobod Gallery", b_chim:"ТЦ Chimgan", pay:"Способ оплаты", cash:"Наличные / карта",
    pay_online:"После нажатия «Оформить заказ» откроется окно оплаты.", pay_cash:"Оплата при получении заказа.",
    name:"Ваше имя", phone:"Номер телефона", addr:"Адрес", addr_ph:"Улица, дом, квартира, ориентир",
    addr_hint:"Стоимость и время доставки сообщит оператор по телефону.", note:"Комментарий (необязательно)", note_ph:"Например: не острое",
    done:"Заказ принят!", done_txt:"Наш оператор скоро свяжется с вами.", add:"Добавить", sum:"сум", pcs:"шт.",
    bar_cart:"Корзина", bar_order:"Оформить заказ", sending:"Отправляем...",
    e_name:"Укажите ваше имя.", e_phone:"Укажите номер телефона полностью.", e_addr:"Укажите адрес доставки.",
    e_test:"Тестовый режим: заказ отправляется только внутри Telegram.", e_paid:n=>`Заказ №${n} оплачен. Наш оператор скоро свяжется с вами.`,
    e_ok:n=>`Заказ №${n}. Наш оператор скоро свяжется с вами.`, e_payfail:"Оплата не прошла. Попробуйте ещё раз или выберите другой способ.",
    e_paycancel:"Оплата не завершена. Попробуйте ещё раз или выберите другой способ.", e_payoff:"Этот способ оплаты пока не подключён. Выберите другой.",
    e_net:"Заказ не отправлен. Проверьте интернет и попробуйте снова."},
};
const q = new URLSearchParams(location.search).get("lang");
let LANG = q === "ru" || q === "uz" ? q : null;
try { LANG = LANG || localStorage.getItem("puri_lang"); } catch (e) {}
if (LANG !== "ru" && LANG !== "uz") {
  const lc = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.language_code;
  LANG = lc === "ru" ? "ru" : "uz";
}
const t = k => T[LANG][k];
const nm = i => LANG === "ru" ? i.ru : i.name;
const nt = i => LANG === "ru" ? i.note_ru : i.note;
const cn = c => LANG === "ru" ? c.name_ru : c.name;
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  $("#payHint").textContent = t(document.querySelector("#pay .on").dataset.v === "cash" ? "pay_cash" : "pay_online");
}

const fmt = n => n.toLocaleString("ru-RU").replace(/\u00a0|,/g, " ") + " " + t("sum");
const byId = id => MENU.items.find(i => i.id === id);

if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.setHeaderColor("#7a1010"); tg.setBackgroundColor("#f7ecdc"); } catch (e) {}
  try { tg.setBottomBarColor && tg.setBottomBarColor("#f7ecdc"); } catch (e) {}
  tg.BackButton.onClick(() => show("menu"));
  tg.MainButton.setParams({color: "#7a1010", text_color: "#ffffff"});
  tg.MainButton.onClick(onMain);
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) $("#name").value = [u.first_name, u.last_name].filter(Boolean).join(" ");
}
$("#barBtn").onclick = onMain;

applyLang();
$("#lang").onclick = e => {
  const l = e.target.dataset.l; if (!l || l === LANG) return;
  LANG = l; try { localStorage.setItem("puri_lang", l); } catch (er) {}
  applyLang(); render();
  if (view === "cart") rows();
};
fetch("menu.json?v=5").then(r => r.json()).then(m => { MENU = m; render(); });

function render() {
  $("#cats").innerHTML = MENU.cats.map((c, i) => `<button data-c="${c.id}" class="${i ? "" : "on"}">${cn(c)}</button>`).join("");
  $("#cats").onclick = e => { const c = e.target.dataset.c; if (c) document.getElementById("c-" + c).scrollIntoView({behavior: "smooth"}); };
  $("#list").innerHTML = MENU.cats.map(c => `<h2 id="c-${c.id}">${cn(c)}</h2><div class="grid">` +
    MENU.items.filter(i => i.cat === c.id).map(i => `<div class="it"><img loading="lazy" decoding="async" width="450" height="600" src="${i.img}?v=5" alt="">
      <div class="b"><div class="n">${nm(i)}</div>${nt(i) ? `<div class="note">${nt(i)}</div>` : ""}
      <div class="p">${fmt(i.price)}</div><div id="ctl-${i.id}"></div></div></div>`).join("") + "</div>").join("");
  MENU.items.forEach(i => ctl(i.id));
  heads = [...document.querySelectorAll("h2")]; curId = "";
  // Scroll paytida faqat kategoriya almashganda tugmani yangilaymiz (iPhoneʼda qotmasligi uchun)
  if (scrollBound) { update(); return; }
  scrollBound = true;
  addEventListener("scroll", () => {
    if (ticking || view !== "menu") return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      let cur = heads[0];
      for (const h of heads) { if (h.getBoundingClientRect().top < 120) cur = h; else break; }
      if (cur.id === curId) return;
      curId = cur.id;
      const nav = $("#cats");
      nav.querySelectorAll("button").forEach(b => {
        const on = "c-" + b.dataset.c === curId; b.classList.toggle("on", on);
        if (on) nav.scrollLeft = b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2;
      });
    });
  }, {passive: true});
  update();
}

function ctl(id) {
  const q = cart[id] || 0, el = document.getElementById("ctl-" + id);
  if (!el) return;
  el.innerHTML = q ? `<div class="qty"><button onclick="chg('${id}',-1)">−</button><span>${q}</span><button onclick="chg('${id}',1)">+</button></div>`
    : `<button class="add" onclick="chg('${id}',1)">${t("add")}</button>`;
}

function chg(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  if (tg) tg.HapticFeedback.selectionChanged();
  ctl(id); update();
  if (view === "cart") { if (!count()) show("menu"); else rows(); }
}
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const total = () => Object.entries(cart).reduce((s, [id, q]) => s + byId(id).price * q, 0);

function update() {
  const n = count();
  let text = "", visible = false;
  if (view === "menu" && n) { text = `${t("bar_cart")} · ${n} ${t("pcs")} · ${fmt(total())}`; visible = true; }
  if (view === "cart") { text = sending ? t("sending") : `${t("bar_order")} · ${fmt(total())}`; visible = true; }
  if (tg) {
    visible ? tg.MainButton.setText(text).show() : tg.MainButton.hide();
    $("#bar").style.display = "none";
  } else { $("#bar").style.display = visible ? "block" : "none"; $("#barBtn").textContent = text; }
}

function rows() {
  $("#rows").innerHTML = Object.entries(cart).map(([id, q]) => { const i = byId(id);
    return `<div class="row"><img src="${i.img}?v=5" alt=""><div class="t"><b>${nm(i)}</b>${fmt(i.price * q)}</div>
    <div class="qty"><button onclick="chg('${id}',-1)">−</button><span>${q}</span><button onclick="chg('${id}',1)">+</button></div></div>`; }).join("");
  $("#total").textContent = fmt(total());
}

function show(v) {
  view = v;
  $("#menu").style.display = v === "menu" ? "block" : "none";
  $("#cart").style.display = v === "cart" ? "block" : "none";
  $("#done").style.display = v === "done" ? "block" : "none";
  if (v === "cart") rows();
  if (tg) v === "cart" ? tg.BackButton.show() : tg.BackButton.hide();
  scrollTo(0, 0); update();
}

document.querySelectorAll(".seg").forEach(s => s.onclick = e => {
  if (!e.target.dataset.v) return;
  s.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target));
  if (s.id === "pay") $("#payHint").textContent = t(e.target.dataset.v === "cash" ? "pay_cash" : "pay_online");
  if (s.id === "type") $("#addrBox").style.display = e.target.dataset.v === "delivery" ? "block" : "none";
});
const seg = id => document.querySelector(`#${id} .on`).dataset.v;

function err(t) { $("#err").textContent = t; $("#err").style.display = t ? "block" : "none"; if (t && tg) tg.HapticFeedback.notificationOccurred("error"); }

async function onMain() {
  if (view === "menu") return show("cart");
  if (view !== "cart" || sending) return;
  const order = {
    items: Object.entries(cart).map(([id, qty]) => ({id, qty})),
    type: seg("type"), branch: seg("branch"), pay: seg("pay"), lang: LANG,
    name: $("#name").value.trim(), phone: $("#phone").value.trim(),
    address: $("#addr").value.trim(), note: $("#note").value.trim(),
  };
  if (!order.name) return err(t("e_name"));
  if (order.phone.replace(/\D/g, "").length < 9) return err(t("e_phone"));
  if (order.type === "delivery" && order.address.length < 5) return err(t("e_addr"));
  err("");
  if (!tg || !API) { $("#doneTxt").textContent = t("e_test"); return show("done"); }
  sending = true; update(); tg.MainButton.showProgress();
  try {
    const r = await fetch(API + "/order", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({initData: tg.initData, order})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "xato");
    if (j.invoice) {
      const status = await new Promise(res => tg.openInvoice(j.invoice, res));
      if (status !== "paid") { err(t(status === "failed" ? "e_payfail" : "e_paycancel")); return; }
      $("#doneTxt").textContent = t("e_paid")(j.number);
    } else $("#doneTxt").textContent = t("e_ok")(j.number);
    cart = {}; MENU.items.forEach(i => ctl(i.id));
    tg.HapticFeedback.notificationOccurred("success");
    show("done"); setTimeout(() => tg.close(), 3500);
  } catch (e) {
    err(t(e.message === "pay_off" ? "e_payoff" : "e_net"));
  } finally { sending = false; tg.MainButton.hideProgress(); update(); }
}
</script>
</body>
</html>
